<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Configuración de pantalla completa y compatibilidad nativa para iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Halterofilia">
  
  <title>🏋️ Asistente de Halterofilia</title>
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --accent-blue: #2563eb;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top, 15px) 15px env(safe-area-inset-bottom, 15px) 15px; }
    .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }

    .header-panel, .card { background-color: var(--panel-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .header-panel { text-align: center; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    h2 { font-size: 1.05rem; margin-bottom: 12px; color: var(--text-muted); }

    .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; color: white; transition: opacity 0.2s; font-size: 0.95rem; }
    .btn:active { opacity: 0.7; }
    .btn-blue { background-color: var(--accent-blue); }
    .btn-green { background-color: var(--accent-green); }
    .btn-dark { background-color: #475569; }

    .input-control, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: #334155; color: white; font-size: 1rem; margin-bottom: 8px; }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .row > * { flex: 1; }

    .mode-selector { display: flex; gap: 10px; margin-bottom: 12px; }
    .mode-btn { flex: 1; padding: 12px; border: 2px solid var(--border-color); background-color: #334155; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .mode-btn.active { border-color: var(--accent-blue); background-color: var(--accent-blue); }

    /* Visualización gráfica */
    .barbell-stage { width: 100%; height: 160px; background-color: #0b1120; border-radius: 10px; border: 1px solid var(--border-color); position: relative; display: flex; align-items: center; justify-content: center; overflow-x: auto; padding: 0 10px; margin-top: 10px; }
    .bar-steel { position: absolute; height: 10px; width: 90%; background: linear-gradient(180deg, #94a3b8 0%, #475569 100%); z-index: 1; border-radius: 4px; }
    .sleeve { position: absolute; height: 100%; display: flex; align-items: center; z-index: 2; }
    .sleeve.left { left: 20px; flex-direction: row-reverse; }
    .sleeve.right { right: 20px; flex-direction: row; }

    .plate-graphic { margin: 0 1px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: bold; writing-mode: vertical-rl; border: 1px solid rgba(0,0,0,0.5); }
    
    .plate-lb { background-color: #111827; color: #f8fafc; border: 1px solid #475569; }
    .plate-kg-2_5 { background-color: #dc2626; color: white; }
    .plate-kg-2 { background-color: #2563eb; color: white; }
    .plate-kg-1_5 { background-color: #ca8a04; color: black; }
    .plate-kg-1 { background-color: #16a34a; color: white; }
    .plate-kg-0_5 { background-color: #f8fafc; color: black; }

    .results-box { background-color: #0b1120; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 10px; font-size: 0.9rem; }
    .footer { text-align: center; font-size: 0.7rem; color: var(--text-muted); padding: 15px 5px; margin-top: auto; border-top: 1px solid var(--border-color); width: 100%; line-height: 1.4; }
    
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 99; padding: 20px; }
    .modal { background-color: var(--panel-bg); width: 100%; max-width: 450px; border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header-panel">
      <h1>🏋️ Asistente de Halterofilia</h1>
      <p id="user-display" style="font-size: 0.85rem; color: var(--text-muted);">Sin usuario activo</p>
      <div style="margin-top: 10px; display: flex; gap: 8px; justify-content: center;">
        <button class="btn btn-dark" onclick="App.abrirInstalacion()">⚙️ Instalación</button>
        <button class="btn btn-dark" onclick="App.cambiarUsuario()">🔄 Cambiar Usuario</button>
      </div>
    </header>

    <main class="card" id="main-ui">
      <h2>Plan de Carga</h2>
      <div class="mode-selector">
        <button id="btn-snatch" class="mode-btn active" onclick="App.setModo('snatch')">Snatch</button>
        <button id="btn-cj" class="mode-btn" onclick="App.setModo('cj')">Clean & Jerk</button>
      </div>

      <div class="row">
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">PR Actual:</label>
          <div id="pr-indicator" style="font-size: 1.1rem; font-weight: bold; color: var(--accent-green);">0 lb</div>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="input-peso" style="font-size: 0.8rem; color: var(--text-muted);">Peso Requerido:</label>
          <input type="number" id="input-peso" class="input-control" placeholder="Ej: 135" step="0.5" inputmode="decimal">
        </div>
        <div>
          <label for="select-unidad" style="font-size: 0.8rem; color: var(--text-muted);">Unidad:</label>
          <select id="select-unidad" class="input-control">
            <option value="lb">Libras (lb)</option>
            <option value="kg">Kilogramos (kg)</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="select-barra" style="font-size: 0.8rem; color: var(--text-muted);">Tipo de Barra:</label>
          <select id="select-barra" class="input-control">
            <option value="45">Pesada (45 lb / 20.4 kg)</option>
            <option value="35">Liviana (35 lb / 15.9 kg)</option>
          </select>
        </div>
      </div>

      <button class="btn btn-blue" style="width: 100%; margin-top: 5px;" onclick="App.procesarCarga()">Aceptar</button>

      <div id="resultados-box" class="results-box hidden">
        <div id="resumen-texto" style="font-weight: bold; margin-bottom: 4px;"></div>
        <div id="detalle-discos" style="font-size: 0.85rem; color: var(--text-muted);"></div>
      </div>

      <div class="barbell-stage">
        <div class="bar-steel"></div>
        <div id="sleeve-left" class="sleeve left"></div>
        <div id="sleeve-right" class="sleeve right"></div>
      </div>
    </main>

    <footer class="footer">
      Anaslisis/Diseño de Andres Aguiar V 1.1 Santiago de Chile Agosto 2026 - Contacto +56933395447 - Whatsapp +56933395447
    </footer>
  </div>

  <!-- Modal de Instalación -->
  <div id="modal-inst" class="modal-overlay hidden">
    <div class="modal">
      <h2 style="color: white; margin-bottom: 10px;">Instalación</h2>
      <div id="step-auth">
        <label style="font-size: 0.8rem;">Contraseña Secreta:</label>
        <input type="password" id="admin-pass" class="input-control" placeholder="Clave de acceso">
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
          <button class="btn btn-dark" onclick="App.cerrarModales()">Cancelar</button>
          <button class="btn btn-blue" onclick="App.validarInstalacion()">Validar</button>
        </div>
      </div>
      <div id="step-user" class="hidden">
        <label style="font-size: 0.8rem;">Primer Nombre:</label>
        <input type="text" id="user-nombre" class="input-control" placeholder="Nombre">
        <label style="font-size: 0.8rem;">Apellido:</label>
        <input type="text" id="user-apellido" class="input-control" placeholder="Apellido">
        <label style="font-size: 0.8rem;">Correo Electrónico:</label>
        <input type="email" id="user-email" class="input-control" placeholder="correo@ejemplo.com">
        <button class="btn btn-green" style="width: 100%; margin-top: 10px;" onclick="App.registrarUsuario()">Completar Registro</button>
      </div>
    </div>
  </div>

  <!-- Modal de Expiración -->
  <div id="modal-lock" class="modal-overlay hidden">
    <div class="modal" style="text-align: center;">
      <h2 style="color: var(--accent-red); margin-bottom: 10px;">Evaluación Expirada</h2>
      <p style="font-size: 0.95rem;">Para la Instalacion definitiva, contactar al +56933395447</p>
    </div>
  </div>

  <script>
    const App = (() => {
      const PASS_SECRET = "NalitaBonita";
      const EXPIRATION_MS = 3 * 24 * 60 * 60 * 1000;
      const KG_TO_LB = 2.20462;

      let state = {
        modoActual: 'snatch',
        usuarioActivo: null,
        usuariosRegistrados: [],
        instaladoEn: null
      };

      const catalogoDiscos = [
        { tipo: 'lb', pesoNominal: 45, pesoLb: 45, altura: 130, ancho: 18, clase: 'plate-lb' },
        { tipo: 'lb', pesoNominal: 35, pesoLb: 35, altura: 130, ancho: 16, clase: 'plate-lb' },
        { tipo: 'lb', pesoNominal: 25, pesoLb: 25, altura: 110, ancho: 14, clase: 'plate-lb' },
        { tipo: 'lb', pesoNominal: 15, pesoLb: 15, altura: 95,  ancho: 12, clase: 'plate-lb' },
        { tipo: 'lb', pesoNominal: 10, pesoLb: 10, altura: 80,  ancho: 10, clase: 'plate-lb' },
        { tipo: 'kg', pesoNominal: 2.5, pesoLb: 2.5 * KG_TO_LB, altura: 70, ancho: 9, clase: 'plate-kg-2_5' },
        { tipo: 'kg', pesoNominal: 2.0, pesoLb: 2.0 * KG_TO_LB, altura: 65, ancho: 8, clase: 'plate-kg-2' },
        { tipo: 'kg', pesoNominal: 1.5, pesoLb: 1.5 * KG_TO_LB, altura: 60, ancho: 8, clase: 'plate-kg-1_5' },
        { tipo: 'kg', pesoNominal: 1.0, pesoLb: 1.0 * KG_TO_LB, altura: 55, ancho: 7, clase: 'plate-kg-1' },
        { tipo: 'kg', pesoNominal: 0.5, pesoLb: 0.5 * KG_TO_LB, altura: 50, ancho: 6, clase: 'plate-kg-0_5' }
      ];

      function init() {
        cargar();
        if (verificarLicencia()) return;
        if (!state.usuarioActivo) {
          abrirInstalacion();
        } else {
          actualizarUI();
        }
      }

      function verificarLicencia() {
        if (!state.instaladoEn) return false;
        if (Date.now() - state.instaladoEn > EXPIRATION_MS) {
          document.getElementById('modal-lock').classList.remove('hidden');
          return true;
        }
        return false;
      }

      function cargar() {
        const raw = localStorage.getItem('__halterofilia_app__');
        if (raw) {
          try { state = JSON.parse(raw); } catch(e) {}
        }
      }

      function guardar() {
        localStorage.setItem('__halterofilia_app__', JSON.stringify(state));
      }

      function abrirInstalacion() {
        document.getElementById('step-auth').classList.remove('hidden');
        document.getElementById('step-user').classList.add('hidden');
        document.getElementById('admin-pass').value = '';
        document.getElementById('modal-inst').classList.remove('hidden');
      }

      function validarInstalacion() {
        if (document.getElementById('admin-pass').value === PASS_SECRET) {
          if (!state.instaladoEn) state.instaladoEn = Date.now();
          document.getElementById('step-auth').classList.add('hidden');
          document.getElementById('step-user').classList.remove('hidden');
        } else {
          alert("Contraseña incorrecta.");
        }
      }

      function registrarUsuario() {
        const nom = document.getElementById('user-nombre').value.trim();
        const ape = document.getElementById('user-apellido').value.trim();
        const mail = document.getElementById('user-email').value.trim();

        if (!nom || !ape || !mail) {
          alert("Completa todos los campos.");
          return;
        }

        const user = { id: Date.now(), nombre: nom, apellido: ape, email: mail, prs: { snatch: 0, cj: 0 } };
        state.usuariosRegistrados.push(user);
        state.usuarioActivo = user;
        guardar();
        cerrarModales();
        actualizarUI();
      }

      function cambiarUsuario() {
        if (verificarLicencia()) return;
        if (state.usuariosRegistrados.length <= 1) {
          abrirInstalacion();
          return;
        }
        const idx = state.usuariosRegistrados.findIndex(u => u.id === state.usuarioActivo.id);
        state.usuarioActivo = state.usuariosRegistrados[(idx + 1) % state.usuariosRegistrados.length];
        guardar();
        actualizarUI();
      }

      function setModo(modo) {
        state.modoActual = modo;
        document.getElementById('btn-snatch').classList.toggle('active', modo === 'snatch');
        document.getElementById('btn-cj').classList.toggle('active', modo === 'cj');
        actualizarUI();
      }

      function actualizarUI() {
        if (!state.usuarioActivo) return;
        document.getElementById('user-display').innerText = `Atleta: ${state.usuarioActivo.nombre} ${state.usuarioActivo.apellido}`;
        const pr = state.usuarioActivo.prs[state.modoActual] || 0;
        document.getElementById('pr-indicator').innerText = `${pr} lb`;
        document.getElementById('input-peso').value = pr > 0 ? pr : '';
      }

      function procesarCarga() {
        if (verificarLicencia()) return;
        if (!state.usuarioActivo) { abrirInstalacion(); return; }

        const peso = parseFloat(document.getElementById('input-peso').value);
        const unidad = document.getElementById('select-unidad').value;
        const barra = parseFloat(document.getElementById('select-barra').value);

        if (isNaN(peso) || peso <= 0) { alert("Ingresa un peso válido."); return; }

        const pesoTotalLb = unidad === 'kg' ? peso * KG_TO_LB : peso;
        if (pesoTotalLb < barra) { alert(`El peso debe ser al menos el de la barra (${barra} lb).`); return; }

        const prActual = state.usuarioActivo.prs[state.modoActual] || 0;
        if (pesoTotalLb > prActual) {
          state.usuarioActivo.prs[state.modoActual] = Math.round(pesoTotalLb * 10) / 10;
          guardar();
          actualizarUI();
        }

        let pesoLado = (pesoTotalLb - barra) / 2.0;
        const seleccion = [];

        for (const d of catalogoDiscos) {
          const cant = Math.floor(pesoLado / d.pesoLb);
          if (cant > 0) {
            seleccion.push({ disco: d, cantidad: cant });
            pesoLado = Math.round((pesoLado - (cant * d.pesoLb)) * 1000) / 1000;
          }
        }

        mostrarResultados(pesoTotalLb, barra, seleccion, pesoLado);
        renderizarBarra(seleccion);
      }

      function mostrarResultados(total, barra, seleccion, rem) {
        const box = document.getElementById('resultados-box');
        box.classList.remove('hidden');
        document.getElementById('resumen-texto').innerText = `Total: ${total.toFixed(1)} lb (~${(total/KG_TO_LB).toFixed(1)} kg)`;

        let texto = `Barra: ${barra} lb | Por lado: `;
        texto += seleccion.length === 0 ? "Solo barra." : seleccion.map(s => `${s.cantidad}x ${s.disco.pesoNominal} ${s.disco.tipo}`).join(' + ');
        if (rem > 0.4) texto += ` | Restan: ${(rem * 2).toFixed(1)} lb`;
        document.getElementById('detalle-discos').innerText = texto;
      }

      function renderizarBarra(seleccion) {
        const izq = document.getElementById('sleeve-left');
        const der = document.getElementById('sleeve-right');
        izq.innerHTML = '';
        der.innerHTML = '';

        seleccion.forEach(item => {
          for (let i = 0; i < item.cantidad; i++) {
            const div = document.createElement('div');
            div.className = `plate-graphic ${item.disco.clase}`;
            div.style.height = `${item.disco.altura}px`;
            div.style.width = `${item.disco.ancho}px`;
            div.innerText = `${item.disco.pesoNominal}`;

            izq.appendChild(div.cloneNode(true));
            der.appendChild(div);
          }
        });
      }

      function cerrarModales() {
        document.getElementById('modal-inst').classList.add('hidden');
      }

      return { init, abrirInstalacion, validarInstalacion, registrarUsuario, cambiarUsuario, setModo, procesarCarga, cerrarModales };
    })();

    document.addEventListener('DOMContentLoaded', App.init);
  </script>
</body>
</html>
