<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Licencias - Panel de Administración</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
    .card { background-color: #151d30; padding: 24px; border-radius: 12px; border: 1px solid #222f49; width: 100%; max-width: 520px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
    h1 { font-size: 1.3rem; margin-bottom: 1rem; color: #38bdf8; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 0.95rem; }
    button { width: 100%; margin-top: 16px; padding: 12px; border-radius: 6px; border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }
    button:hover { opacity: 0.9; }
    .result { margin-top: 16px; padding: 12px; background: #050811; border: 1px solid #10b981; border-radius: 6px; word-break: break-all; font-family: monospace; color: #34d399; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🔑 Emisor de Licencias</h1>
    
    <label for="req-code">1. Código de Solicitud del Cliente:</label>
    <textarea id="req-code" rows="3" placeholder="Pega aquí el código que te envió el cliente..."></textarea>

    <label for="lic-duration">2. Duración de la Licencia:</label>
    <select id="lic-duration">
      <option value="30">Mensual (30 Días)</option>
      <option value="365">Anual (365 Días)</option>
      <option value="9999">Vitalicia / Permanente</option>
    </select>

    <button onclick="generarLicencia()">Generar Clave de Activación</button>

    <div id="box-result" class="result">
      <strong>Clave generada (Envía esto al cliente):</strong>
      <p id="txt-key" style="margin-top: 8px;"></p>
    </div>
  </div>

  <script>
    // Clave privada maestra compartida únicamente entre tu generador y la app
    const CLAVE_SECRETA_ADMIN = "Halterofilia-SuperSecret-Salt-2026";

    async function sha256(texto) {
      const buffer = new TextEncoder().encode(texto);
      const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function generarLicencia() {
      const solicitud = document.getElementById("req-code").value.trim();
      const dias = parseInt(document.getElementById("lic-duration").value);

      if (!solicitud.startsWith("REQ|")) {
        alert("El código de solicitud no es válido. Debe comenzar por 'REQ|'");
        return;
      }

      // 1. Calcular fecha de vencimiento
      const expDate = new Date();
      expDate.setDate(expDate.getDate() + dias);
      const expDateStr = expDate.toISOString().split("T")[0]; // Formato YYYY-MM-DD

      // 2. Crear firma digital con la clave secreta
      const payload = `${solicitud}|EXP:${expDateStr}`;
      const firma = (await sha256(payload + CLAVE_SECRETA_ADMIN)).substring(0, 16).toUpperCase();

      // 3. Empaquetar todo en Base64 para que sea una sola cadena fácil de copiar
      const claveActivacion = btoa(`${payload}|SIG:${firma}`);

      document.getElementById("box-result").style.display = "block";
      document.getElementById("txt-key").innerText = claveActivacion;
    }
  </script>
</body>
</html>
